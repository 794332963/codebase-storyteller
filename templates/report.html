<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --page: #ffffff; --surface: #f8fafc; --surface-strong: #f1f5f9; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b; --blue: #2563eb; --blue-soft: #eff6ff;
      --green: #15803d; --green-soft: #f0fdf4; --orange: #c2410c; --orange-soft: #fff7ed;
      --red: #b91c1c; --red-soft: #fef2f2; --shadow: 0 1px 2px rgba(15, 23, 42, .05);
      --sidebar-width: 252px; --content-width: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--text); background: var(--page); font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, .diagram-zoom:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .layout { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 16px; border-right: 1px solid var(--border); background: #fbfdff; }
    .toc { display: grid; gap: 2px; }
    .toc a { display: block; padding: 6px 8px; border-radius: 5px; color: var(--muted); font-size: 13px; }
    .toc a:hover { color: var(--text); background: var(--surface-strong); text-decoration: none; }
    .toc a.active { color: var(--blue); background: var(--blue-soft); font-weight: 650; }
    main { min-width: 0; }
    .page { max-width: var(--content-width); margin: 0 auto; padding: 44px 44px 72px; }
    .report-header { padding-bottom: 28px; border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 12px; font-weight: 700; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: 0; }
    h1 { font-size: 30px; }
    h2 { margin-bottom: 18px; font-size: 22px; }
    h3 { margin: 24px 0 10px; font-size: 16px; }
    h4 { margin: 18px 0 8px; font-size: 14px; }
    p { margin: 0 0 12px; }
    section { scroll-margin-top: 28px; margin-top: 44px; }
    .summary { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--blue); background: var(--blue-soft); }
    .meta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .meta-item { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
    .meta-item b { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
    .card { margin: 16px 0; padding: 18px; border: 1px solid var(--border); border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .card > :last-child { margin-bottom: 0; }
    .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .card-title h3 { margin: 0; }
    .read-guide, .muted { color: var(--muted); }
    .legend, .tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { display: inline-flex; align-items: center; padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; line-height: 1.4; background: var(--surface); }
    .tag.fact { color: #1d4ed8; background: var(--blue-soft); border-color: #bfdbfe; }
    .tag.inference { color: #9a3412; background: var(--orange-soft); border-color: #fed7aa; }
    .tag.gap { color: #475569; background: var(--surface-strong); }
    .tag.terminal { color: var(--green); background: var(--green-soft); border-color: #bbf7d0; }
    .diagram-zoom { position: relative; overflow: auto; margin-top: 14px; padding: 16px; border: 1px solid var(--border); border-radius: 6px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); cursor: zoom-in; }
    .diagram-zoom::after { content: "点击放大"; position: sticky; left: 100%; bottom: 0; display: block; width: max-content; margin-left: auto; padding: 2px 6px; color: var(--muted); background: rgba(255,255,255,.92); font-size: 11px; }
    .diagram-zoom svg { display: block; width: 100%; height: auto; min-width: 640px; background: #fff; }
    .diagram-zoom svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .code-open { display: inline-flex; align-items: center; min-height: 26px; padding: 3px 8px; border: 1px solid #bfdbfe; border-radius: 5px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 650; text-decoration: none; }
    .code-open:hover { background: #dbeafe; text-decoration: none; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); background: var(--surface); font-size: 12px; font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    code { padding: 1px 4px; border-radius: 3px; background: var(--surface-strong); font-size: .92em; }
    .method-grid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; margin: 12px 0; }
    .method-grid dt { color: var(--muted); font-weight: 650; }
    .method-grid dd { margin: 0; }
    .notice { padding: 12px 14px; border: 1px solid #fed7aa; border-radius: 6px; background: var(--orange-soft); color: #7c2d12; }
    .danger { border-color: #fecaca; background: var(--red-soft); color: #7f1d1d; }
    .highlight { margin: 16px 0; padding: 12px 14px; border-left: 3px solid #3b82f6; background: #f8fbff; color: #334155; }
    .highlight > :last-child { margin-bottom: 0; }
    .lightbox { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 28px; background: rgba(248, 250, 252, .96); }
    .lightbox.open { display: grid; }
    .lightbox-panel { position: relative; width: min(1500px, 96vw); max-height: 92vh; overflow: auto; padding: 18px; border-radius: 8px; background: #fff; box-shadow: 0 18px 52px rgba(15, 23, 42, .25); }
    .lightbox-title { margin: 0 42px 10px 0; font-size: 14px; }
    .lightbox-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 5px; background: #fff; color: var(--text); cursor: pointer; font-size: 20px; line-height: 1; }
    #lightbox-content, .lightbox svg { background: #fff; }
    .lightbox svg { width: 100%; height: auto; min-width: 900px; }
    .top-link { display: inline-flex; margin-top: 24px; color: var(--muted); font-size: 12px; }
    @media (max-width: 920px) {
      .layout { display: block; }
      .sidebar { position: static; width: auto; height: auto; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
      .toc { display: flex; overflow-x: auto; gap: 4px; padding: 0 4px 2px; white-space: nowrap; }
      .toc a { flex: 0 0 auto; }
      .page { padding: 28px 18px 48px; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media print {
      .sidebar, .lightbox { display: none !important; }
      .layout { display: block; }
      .page { max-width: none; padding: 0; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="报告目录">
      <nav class="toc" id="toc">
        {{TOC_ITEMS}}
      </nav>
    </aside>
    <main id="top">
      <article class="page">
        <header class="report-header">
          <p class="eyebrow">代码业务梳理报告</p>
          <h1>{{REPORT_TITLE}}</h1>
          <div class="meta-grid">
            <div class="meta-item"><b>涉及仓库</b>{{REPOSITORIES}}</div>
            <div class="meta-item"><b>分析分支</b>{{ANALYSIS_BRANCH}}</div>
            <div class="meta-item"><b>生成时间</b>{{GENERATED_AT}}</div>
          </div>
          <p class="notice">{{SOURCE_NOTICE}}</p>
          <div class="legend" aria-label="证据图例">
            <span class="tag fact">事实</span>
            <span class="tag inference">代码推断</span>
            <span class="tag gap">证据不足</span>
          </div>
        </header>
        {{REPORT_SECTIONS}}
      </article>
    </main>
  </div>
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="放大查看图表">
    <div class="lightbox-panel" role="document">
      <button class="lightbox-close" type="button" aria-label="关闭放大图">×</button>
      <h2 class="lightbox-title" id="lightbox-title"></h2>
      <div id="lightbox-content"></div>
    </div>
  </div>
  <script>
    (() => {
      const tocLinks = [...document.querySelectorAll('.toc a[href^="#"]')];
      const sections = tocLinks.map(link => document.querySelector(link.getAttribute('href'))).filter(Boolean);
      const activate = () => {
        const threshold = window.scrollY + 120;
        let active = sections[0];
        for (const section of sections) if (section.offsetTop <= threshold) active = section;
        tocLinks.forEach(link => link.classList.toggle('active', active && link.getAttribute('href') === '#' + active.id));
      };
      window.addEventListener('scroll', activate, { passive: true });
      window.addEventListener('resize', activate);
      activate();

      const modal = document.getElementById('lightbox');
      const content = document.getElementById('lightbox-content');
      const title = document.getElementById('lightbox-title');
      const close = () => { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); content.replaceChildren(); };
      const open = (source) => {
        const svg = source.querySelector('svg');
        if (!svg) return;
        title.textContent = source.dataset.lightboxTitle || '图表';
        content.appendChild(svg.cloneNode(true));
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        modal.querySelector('.lightbox-close').focus();
      };
      document.querySelectorAll('.diagram-zoom').forEach(item => {
        item.addEventListener('click', () => open(item));
        item.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(item); } });
      });
      modal.addEventListener('click', event => { if (event.target === modal || event.target.closest('.lightbox-close')) close(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
